<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Docentes - Beth Shalom / Maya Tikal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Cliente Oficial de Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- BARRA DE NAVEGACIÓN SUPERIOR -->
    <header class="bg-indigo-900 text-white shadow-md p-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <img src="../assets/BS_Logo_3D.png" alt="Logo" class="w-10 h-10 object-contain">
                <div>
                    <h1 class="text-base font-bold">Liceo Cristiano "Beth Shalom" / Maya Tikal</h1>
                    <p class="text-xs text-indigo-200">Módulo de Gestión y Registro de Docentes</p>
                </div>
            </div>
            <div class="flex items-center gap-3 text-sm">
                <a href="dashboard.html" class="bg-indigo-800 hover:bg-indigo-700 text-white text-xs px-3 py-1.5 rounded shadow transition font-bold">
                    🏠 Volver al Dashboard
                </a>
                <button onclick="cerrarSesion()" class="bg-red-600 hover:bg-red-700 text-white text-xs px-3 py-1.5 rounded shadow transition font-bold">
                    🔒 Cerrar Sesión
                </button>
            </div>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="max-w-5xl mx-auto p-6 w-full flex-1 space-y-6">
        
        <div class="flex justify-between items-center">
            <h2 class="text-2xl font-extrabold text-slate-800">Administración de Cuentas Docentes</h2>
            <span id="userInfo" class="text-xs font-semibold bg-white px-3 py-1.5 rounded-lg border shadow-sm">Cargando usuario...</span>
        </div>

        <!-- TARJETA DE REGISTRO -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-6">
            
            <!-- Formulario de Registro -->
            <div class="space-y-4 bg-slate-50 p-4 rounded-xl border">
                <h3 class="font-bold text-indigo-900 text-sm uppercase">Registrar Nuevo Docente</h3>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Nombre Completo</label>
                        <input type="text" id="docNombre" placeholder="Ej: Profe. Juan Pérez" class="w-full border border-slate-300 p-2.5 text-sm rounded-lg outline-none bg-white">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Correo Electrónico</label>
                        <input type="email" id="docCorreo" placeholder="docente@bethshalom.edu.gt" class="w-full border border-slate-300 p-2.5 text-sm rounded-lg outline-none bg-white">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">PIN / Contraseña de Acceso</label>
                        <input type="password" id="docPass" placeholder="••••••••" class="w-full border border-slate-300 p-2.5 text-sm rounded-lg outline-none bg-white">
                    </div>
                </div>

                <button onclick="registrarDocente()" id="btnGuardarDoc" class="w-full bg-purple-700 hover:bg-purple-800 text-white text-xs py-3 rounded-lg font-bold transition shadow">
                    + Registrar Cuenta de Docente
                </button>
            </div>

            <!-- Tabla de Docentes Registrados -->
            <div class="space-y-2">
                <p class="text-xs font-bold text-slate-500 uppercase">Docentes Registrados en la Plataforma:</p>
                <div class="overflow-x-auto border rounded-xl">
                    <table class="w-full text-sm text-left">
                        <thead class="bg-slate-100 border-b text-xs uppercase text-slate-600">
                            <tr>
                                <th class="p-3">Nombre Completo</th>
                                <th class="p-3">Correo Electrónico</th>
                                <th class="p-3 text-center">Rol</th>
                                <th class="p-3 text-center w-28">Estado</th>
                            </tr>
                        </thead>
                        <tbody id="tablaDocentes">
                            <tr><td colspan="4" class="p-4 text-center text-slate-400">Cargando docentes...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <!-- SCRIPTS DE SEGURIDAD Y LÓGICA -->
    <script src="../js/supabase-client.js"></script>
    <script src="../js/auth-guard.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const perfil = await verificarAccesoPorRol(['admin', 'director']);
            if (perfil) {
                document.getElementById('userInfo').innerText = `Usuario: ${perfil.nombre_completo || perfil.rol}`;
                await cargarTablaDocentes();
            }
        });

        async function cerrarSesion() {
            await supabaseClient.auth.signOut();
            window.location.href = '../index.html';
        }

        async function registrarDocente() {
            const nombre = document.getElementById('docNombre').value.trim();
            const email = document.getElementById('docCorreo').value.trim();
            const password = document.getElementById('docPass').value;
            const btn = document.getElementById('btnGuardarDoc');

            if (!nombre || !email || !password) {
                return alert("Por favor complete todos los campos (Nombre, Correo y Contraseña/PIN).");
            }

            if (password.length < 6) {
                return alert("La contraseña o PIN debe tener al menos 6 caracteres.");
            }

            btn.disabled = true;
            btn.innerText = "Creando cuenta de usuario...";

            // 1. Registrar usuario en Supabase Auth
            const { data: authData, error: authError } = await supabaseClient.auth.signUp({
                email: email,
                password: password,
                options: {
                    data: { nombre_completo: nombre, rol: 'docente' }
                }
            });

            if (authError) {
                alert("Error al crear usuario: " + authError.message);
                btn.disabled = false;
                btn.innerText = "+ Registrar Cuenta de Docente";
                return;
            }

            // 2. Registrar/Asegurar perfil en la tabla perfiles_usuarios
            if (authData.user) {
                const { error: perfError } = await supabaseClient.from('perfiles_usuarios').upsert([{
                    id: authData.user.id,
                    nombre_completo: nombre,
                    rol: 'docente'
                }]);

                if (perfError) {
                    console.error("Error al vincular perfil:", perfError);
                }
            }

            alert("✅ Cuenta docente creada exitosamente.");
            document.getElementById('docNombre').value = '';
            document.getElementById('docCorreo').value = '';
            document.getElementById('docPass').value = '';
            
            btn.disabled = false;
            btn.innerText = "+ Registrar Cuenta de Docente";
            
            cargarTablaDocentes();
        }

        async function cargarTablaDocentes() {
            const tbody = document.getElementById('tablaDocentes');
            
            const { data, error } = await supabaseClient
                .from('perfiles_usuarios')
                .select('*')
                .eq('rol', 'docente')
                .order('nombre_completo');

            if (error) {
                console.error(error);
                tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-red-500">Error al cargar listado de docentes.</td></tr>`;
                return;
            }

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-slate-400">No hay docentes registrados aún.</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            data.forEach(doc => {
                tbody.innerHTML += `
                    <tr class="border-b hover:bg-slate-50">
                        <td class="p-3 font-semibold text-slate-800">${doc.nombre_completo || 'Sin Nombre'}</td>
                        <td class="p-3 text-slate-600">${doc.email || 'Email Registrado en Auth'}</td>
                        <td class="p-3 text-center">
                            <span class="bg-purple-100 text-purple-800 text-xs px-2.5 py-1 rounded-full font-bold uppercase">Docente</span>
                        </td>
                        <td class="p-3 text-center">
                            <span class="bg-emerald-100 text-emerald-800 text-xs px-2 py-0.5 rounded font-semibold">Activo</span>
                        </td>
                    </tr>
                `;
            });
        }
    </script>
</body>
</html>
