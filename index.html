<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Institucional - Beth Shalom / Maya Tikal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Cliente Oficial de Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl border border-slate-200 p-8 w-full max-w-md">
        <div class="text-center mb-6">
            <!-- LOGOTIPO INSTITUCIONAL -->
            <div class="w-24 h-24 mx-auto mb-3 flex items-center justify-center overflow-hidden">
                <img src="assets/BS_Logo_3D.png" alt="Logotipo Oficial" class="w-full h-full object-contain drop-shadow-md">
            </div>
            
            <h2 class="text-2xl font-extrabold text-slate-800">Plataforma Académica</h2>
            <p class="text-xs text-slate-500 mt-1">Liceo Cristiano "Beth Shalom" / Maya Tikal</p>
        </div>

        <div id="errorAlert" class="hidden mb-4 p-3 bg-red-100 border border-red-300 text-red-700 text-xs rounded-lg font-medium"></div>

        <form onsubmit="iniciarSesion(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Correo Electrónico</label>
                <input type="email" id="loginEmail" required value="bspamati@gmail.com"
                    class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Contraseña</label>
                <input type="password" id="loginPass" required
                    class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="••••••••">
            </div>
            <button type="submit" id="btnLogin" class="w-full bg-indigo-900 hover:bg-indigo-800 text-white font-bold py-3 rounded-lg text-sm shadow transition">
                Ingresar al Sistema
            </button>
        </form>
    </div>

    <!-- Cargamos nuestro cliente centralizado -->
    <script src="js/supabase-client.js"></script>
    <script>
        async function iniciarSesion(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPass').value;
            const errorAlert = document.getElementById('errorAlert');
            const btnLogin = document.getElementById('btnLogin');

            errorAlert.classList.add('hidden');
            btnLogin.innerText = "Verificando credenciales...";
            btnLogin.disabled = true;

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

            if (error) {
                errorAlert.innerText = "❌ Error de ingreso: " + error.message;
                errorAlert.classList.remove('hidden');
                btnLogin.innerText = "Ingresar al Sistema";
                btnLogin.disabled = false;
                return;
            }

            const { data: perfil, error: errPerfil } = await supabaseClient
                .from('perfiles_usuarios')
                .select('rol')
                .eq('id', data.user.id)
                .single();

            if (errPerfil || !perfil) {
                errorAlert.innerText = "❌ El usuario autenticado no tiene un perfil registrado en el sistema.";
                errorAlert.classList.remove('hidden');
                btnLogin.innerText = "Ingresar al Sistema";
                btnLogin.disabled = false;
                return;
            }

            if (perfil.rol === 'admin' || perfil.rol === 'director') {
                window.location.href = 'admin/dashboard.html';
            } else if (perfil.rol === 'docente') {
                window.location.href = 'docente/zonograma.html';
            } else {
                alert("Rol no reconocido en el sistema.");
            }
        }
    </script>
</body>
</html>
